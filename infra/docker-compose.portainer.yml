version: "3.9"

# Production-ready compose for Portainer stack deployment.
# No local volume mounts — code is baked into the image.
# Migrations run automatically on backend startup via entrypoint.sh.

services:
  postgres:
    image: postgres:16-alpine
    container_name: networkhub_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-networkhub}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-networkhub_secret}
      POSTGRES_DB: ${POSTGRES_DB:-networkhub}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-networkhub}"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: networkhub_redis
    restart: unless-stopped
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ../backend
      dockerfile: ../infra/Dockerfile.backend
    image: networkhub_backend:latest
    container_name: networkhub_backend
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-networkhub}:${POSTGRES_PASSWORD:-networkhub_secret}@postgres:5432/${POSTGRES_DB:-networkhub}
      REDIS_URL: redis://redis:6379/0
      SECRET_KEY: ${SECRET_KEY:?SECRET_KEY is required}
      SENDGRID_API_KEY: ${SENDGRID_API_KEY:-}
      EMAIL_FROM: ${EMAIL_FROM:-noreply@networkhub.app}
      EMAIL_FROM_NAME: ${EMAIL_FROM_NAME:-NetworkHub}
      SENTRY_DSN: ${SENTRY_DSN:-}
      ENVIRONMENT: ${ENVIRONMENT:-production}
      EMAIL_DAILY_LIMIT: ${EMAIL_DAILY_LIMIT:-20}
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  worker:
    build:
      context: ../backend
      dockerfile: ../infra/Dockerfile.worker
    image: networkhub_worker:latest
    container_name: networkhub_worker
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-networkhub}:${POSTGRES_PASSWORD:-networkhub_secret}@postgres:5432/${POSTGRES_DB:-networkhub}
      REDIS_URL: redis://redis:6379/0
      SECRET_KEY: ${SECRET_KEY:?SECRET_KEY is required}
      SENDGRID_API_KEY: ${SENDGRID_API_KEY:-}
      EMAIL_FROM: ${EMAIL_FROM:-noreply@networkhub.app}
      EMAIL_FROM_NAME: ${EMAIL_FROM_NAME:-NetworkHub}
      SENTRY_DSN: ${SENTRY_DSN:-}
      ENVIRONMENT: ${ENVIRONMENT:-production}
      EMAIL_DAILY_LIMIT: ${EMAIL_DAILY_LIMIT:-20}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  flower:
    image: mher/flower:2.0.0
    container_name: networkhub_flower
    restart: unless-stopped
    environment:
      CELERY_BROKER_URL: redis://redis:6379/0
      FLOWER_PORT: 5555
    ports:
      - "5555:5555"
    depends_on:
      - redis

volumes:
  postgres_data:
  redis_data:
